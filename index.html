<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Locora AI — Business Copilot & Verified Directory</title>
    <meta name="description" content="The autonomous AI business operating system and verified local business directory. Discover top-rated service providers, automate Google Maps SEO, and manage local growth." />
    <meta name="robots" content="index, follow" />
    <script>
      (function() {
        try {
          var h = (window.location.hostname || '').toLowerCase();
          var p = (window.location.pathname || '').toLowerCase();
          var isApp = h === 'app.locoraai.com' || h.indexOf('app.') === 0 || h.indexOf('app-') !== -1;
          var isDashboard = isApp || /^\/(dashboard|visibility|growth|ai-manager|seo|reputation|customers|content|reports|work|crm|invoices|proposals|settings|business-brain|lead-prospector|projects|clients|website-audit)/.test(p);
          if (isDashboard) {
            var r = document.querySelector('meta[name="robots"]');
            if (r) {
              r.setAttribute('content', 'noindex, nofollow');
            } else {
              r = document.createElement('meta');
              r.name = 'robots';
              r.content = 'noindex, nofollow';
              document.head.appendChild(r);
            }
            var c = document.querySelector('link[rel="canonical"]');
            if (c) c.remove();
            var kw = document.querySelector('meta[name="keywords"]');
            if (kw) kw.remove();
          }
        } catch(e) {}
      })();
    </script>
    <link rel="canonical" href="https://locoraai.com/" />

    <!-- DNS Prefetch & Preconnect for Fast LCP & Low Latency -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Preload Hero Brand Asset for Sub-2.5s LCP -->
    <link rel="preload" as="image" href="/locora-logo-tight.png" fetchpriority="high" type="image/png" />

    <!-- Favicon and App Branding -->
    <link rel="icon" type="image/png" sizes="32x32" href="/locora-logo-tight.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/locora-logo-tight.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/locora-logo.png" />

    <!-- Google tag (gtag.js) - Asynchronous for Low TBT -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JK4D86S70Z"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      (function() {
        var isDebug = false;
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.get('ga_debug') === '0' || params.get('ga_debug') === 'false') {
            sessionStorage.removeItem('locora_ga_debug');
            isDebug = false;
          } else if (params.get('ga_debug') === '1' || params.get('debug_mode') === 'true') {
            isDebug = true;
            sessionStorage.setItem('locora_ga_debug', '1');
          } else if (sessionStorage.getItem('locora_ga_debug') === '1') {
            isDebug = true;
          }
        } catch (e) {}

        if (isDebug) {
          gtag('config', 'G-JK4D86S70Z', { debug_mode: true });
        } else {
          gtag('config', 'G-JK4D86S70Z');
        }
      })();
    </script>

    <!-- Google Identity Services (Deferred for Fast TBT) -->

    <script>
      (function() {
        try {
          var realFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return typeof realFetch === 'function' ? realFetch.bind(window) : realFetch;
            },
            set: function(fn) {
              realFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Fetch descriptor initialization info:', e);
        }
      })();
